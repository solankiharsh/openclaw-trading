# Railway: set this service's Root Directory to "backend" so install/build run here.
# Otherwise "bun install" runs at repo root (no deps) and "bun run build" fails resolving hono.
[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Prisma at build time so start only runs the server (healthcheck passes).
# Requires DATABASE_URL in Railway service variables (available at build).
cmds = ["bunx prisma generate", "bunx prisma db push --accept-data-loss"]

[start]
cmd = "bun run src/index.ts"
