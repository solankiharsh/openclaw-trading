# Railway: set this service's Root Directory to "backend" so install/build run here.
# Otherwise "bun install" runs at repo root (no deps) and "bun run build" fails resolving hono.
[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
# Optional: uncomment to produce dist/ (start would need to use it)
# cmds = ["bun run build"]
cmds = []

[start]
cmd = "bun run src/index.ts"
